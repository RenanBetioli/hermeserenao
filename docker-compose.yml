services:
  hermeserenao:
    build: .
    container_name: hermeserenao
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./state:/app/state
      - ./context:/app/context:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
