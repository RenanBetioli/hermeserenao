<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hermeserenao · central de operações</title>
<style>
  :root {
    --bg: #0f1215;
    --panel: #161a1e;
    --panel-2: #1b2025;
    --line: #2a3138;
    --ink: #e7eaed;
    --muted: #8b959f;
    --accent: #e0a458;
    --ok: #63b57c;
    --warn: #d7a24e;
    --off: #6b747d;
    --sans: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; }
  header {
    height: 58px; border-bottom: 1px solid var(--line); display: flex; align-items: center;
    justify-content: space-between; padding: 0 20px; background: var(--panel);
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand strong { font-size: 17px; letter-spacing: .2px; }
  .brand span { color: var(--muted); font-size: 12px; }
  .badge {
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    border: 1px solid #57452d; border-radius: 999px; padding: 5px 10px;
  }
  main { display: grid; grid-template-columns: 250px minmax(0, 1fr) 320px; gap: 14px; padding: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  .panel h2 {
    margin: 0 0 14px; font-size: 11px; font-weight: 650; letter-spacing: 1.4px;
    text-transform: uppercase; color: var(--muted);
  }
  .panel h3 { margin: 22px 0 10px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; background: var(--off); }
  .dot.ok { background: var(--ok); } .dot.demo { background: var(--warn); } .dot.off { background: var(--off); }
  .comp { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid #23292f; }
  .comp:last-child { border-bottom: 0; }
  .comp b { display: block; font-weight: 550; font-size: 13px; }
  .comp small { color: var(--muted); font-size: 11px; }
  .arch { width: 100%; height: auto; display: block; border-radius: 8px; background: #12161a; border: 1px solid #23292f; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 8px 6px; border-bottom: 1px solid #23292f; vertical-align: top; }
  td.ts { font-family: var(--mono); color: var(--muted); white-space: nowrap; width: 150px; }
  td.kind { font-family: var(--mono); color: var(--accent); width: 120px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); border-radius: 7px; padding: 10px; font-family: var(--sans); font-size: 13px; }
  button { background: #3b2f1e; color: var(--accent); border: 1px solid #6d5535; border-radius: 7px; padding: 10px 14px; cursor: pointer; font-family: var(--sans); font-size: 13px; }
  button:hover { background: #4a3a25; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .answer { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .answer .src { font-family: var(--mono); font-size: 11px; color: var(--accent); }
  .answer p { margin: 4px 0 14px; color: #cbd2d8; line-height: 1.5; font-size: 12px; }
  .rowlist { list-style: none; margin: 0; padding: 0; }
  .rowlist li { padding: 8px 0; border-bottom: 1px solid #23292f; font-size: 12px; }
  .rowlist li:last-child { border-bottom: 0; }
  .rowlist small { display: block; color: var(--muted); font-family: var(--mono); font-size: 10px; margin-top: 3px; word-break: break-all; }
  .empty { color: var(--muted); font-size: 12px; }
  footer { padding: 0 18px 18px; color: var(--muted); font-size: 11px; font-family: var(--mono); }
  @media (max-width: 1180px) { main { grid-template-columns: 230px minmax(0, 1fr); } .rail { grid-column: 1 / -1; } }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } .rail { grid-column: auto; } header { padding: 0 12px; } }
</style>
</head>
<body>
<header>
  <div class="brand"><strong>hermeserenao</strong><span>central de operações</span></div>
  <div class="badge" id="mode">LOCAL · DEMO</div>
</header>
<main>
  <section class="panel" aria-labelledby="comp-title">
    <h2 id="comp-title">Componentes</h2>
    <div id="components"><p class="empty">Carregando…</p></div>
    <h3>Agendador</h3>
    <ul class="rowlist" id="jobs"></ul>
  </section>

  <section class="panel" aria-labelledby="arch-title">
    <h2 id="arch-title">Arquitetura</h2>
    <img class="arch" src="/api/architecture.svg" alt="Diagrama da arquitetura local">
    <h3>Eventos recentes</h3>
    <table><tbody id="events"><tr><td class="empty">Carregando…</td></tr></tbody></table>
  </section>

  <section class="panel rail" aria-labelledby="ask-title">
    <h2 id="ask-title">Perguntar à base</h2>
    <form id="ask-form">
      <input id="question" type="text" placeholder="ex.: como tratar segredos?" autocomplete="off" required>
      <button type="submit">Buscar</button>
    </form>
    <div id="answer" class="answer"><p class="empty">Busca determinística nos arquivos de contexto. Sem LLM e sem custo.</p></div>
    <h3>Base de contexto</h3>
    <ul class="rowlist" id="context"></ul>
    <h3>Skills</h3>
    <ul class="rowlist" id="skills"></ul>
  </section>
</main>
<footer id="footer">aguardando status…</footer>
<script>
const $ = (id) => document.getElementById(id);
const text = (el, value) => { el.textContent = value; };

async function getJSON(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(path + ' -> ' + r.status);
  return r.json();
}

function renderStatus(data) {
  const box = $('components');
  box.replaceChildren();
  data.components.forEach((c) => {
    const row = document.createElement('div');
    row.className = 'comp';
    const dot = document.createElement('span');
    dot.className = 'dot ' + c.state;
    const body = document.createElement('div');
    const b = document.createElement('b'); b.textContent = c.label;
    const s = document.createElement('small'); s.textContent = c.detail;
    body.append(b, s); row.append(dot, body); box.append(row);
  });
  const d = new Date(data.generated_at * 1000);
  text($('footer'), 'estado lido do filesystem · ' + d.toLocaleTimeString('pt-BR') + ' · nenhum dado externo enviado');
}

function renderList(id, items, titleKey, subKey) {
  const ul = $(id); ul.replaceChildren();
  items.forEach((item) => {
    const li = document.createElement('li');
    li.textContent = item[titleKey];
    if (subKey && item[subKey]) { const s = document.createElement('small'); s.textContent = item[subKey]; li.append(s); }
    ul.append(li);
  });
}

function renderEvents(rows) {
  const tb = $('events'); tb.replaceChildren();
  if (!rows.length) { const tr = document.createElement('tr'); const td = document.createElement('td'); td.className = 'empty'; td.textContent = 'Nenhum evento registrado.'; tr.append(td); tb.append(tr); return; }
  rows.forEach((e) => {
    const tr = document.createElement('tr');
    const ts = document.createElement('td'); ts.className = 'ts'; ts.textContent = e.ts || '';
    const kind = document.createElement('td'); kind.className = 'kind'; kind.textContent = e.kind || '';
    const detail = document.createElement('td'); detail.textContent = e.detail || '';
    tr.append(ts, kind, detail); tb.append(tr);
  });
}

$('ask-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const q = $('question').value.trim();
  if (!q) return;
  const out = $('answer');
  out.replaceChildren();
  const wait = document.createElement('p'); wait.className = 'empty'; wait.textContent = 'Buscando…'; out.append(wait);
  try {
    const r = await fetch('/api/ask', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question: q})});
    const data = await r.json();
    out.replaceChildren();
    if (!data.answers || !data.answers.length) {
      const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Nenhum trecho correspondente.'; out.append(p); return;
    }
    data.answers.forEach((a) => {
      const src = document.createElement('div'); src.className = 'src'; src.textContent = a.source + ':' + a.line;
      const p = document.createElement('p'); p.textContent = a.text;
      out.append(src, p);
    });
  } catch (err) {
    out.replaceChildren();
    const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Falha na busca: ' + err.message; out.append(p);
  }
});

Promise.all([getJSON('/api/status'), getJSON('/api/context'), getJSON('/api/skills'), getJSON('/api/events'), getJSON('/api/jobs')])
  .then(([status, context, skills, events, jobs]) => {
    renderStatus(status);
    renderList('context', context, 'title', 'path');
    renderList('skills', skills, 'name', 'description');
    renderList('jobs', jobs, 'description', 'id');
    renderEvents(events);
  })
  .catch((err) => { text($('footer'), 'Falha ao carregar: ' + err.message); });
</script>
</body>
</html>
